<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questão 04 - JS</title>
    <script src="./q4.js" defer></script>
</head>
<body>

    <header>
        <nav>
            <a href="../index.html">Voltar ao menu de questões.</a>
        </nav>
    </header>

    <h1>Questão 04 - JS</h1>
    <h2>Escreva um programa que calcule o perímetro (circunferência) de um círculo a partir do valor do raio.</h2>
    
    <form id="calcPerimetro">
        <label for="raio">Digite o valor do raio para o cálculo do perímetro:</label>

        <input
            id="raio"
            type="number"
            min="0"
            step="0.01"
            required
        >

        <button type="submit">Calcular Perímetro</button>
    </form>

    <p id="perimetro"></p>

</body>
</html>
