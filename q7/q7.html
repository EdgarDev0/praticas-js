<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./q7.js" defer></script>
    <title>Questão 07 - JS</title>
</head>
<body>

    <header>
        <nav>
            <a href="../index.html">Voltar ao menu de questões.</a>
        </nav>
    </header>

    <h1>Questão 07 - JS</h1>
    <h2>
        Crie um programa que calcule o IMC do usuário a partir dos seus dados de altura e peso. Ao final, o programa
        deve informar em qual faixa de peso o usuário está.
    </h2>

    <form id="calcIMC">
        <label for="altura">Informe sua altura:</label>
        <input 
            id="altura" 
            type="number"
            min="0.40"
            max="2.50"
            step="0.01"
            required
        >
        <label for="peso">Informe seu peso:</label>
        <input 
        id="peso"
        type="number"
        min="0.50"
        max="350.00"
        step="0.01"
        required
        >

        <button type="submit">Calcular IMC</button>
    </form>

    <p id="resultado"></p>
    
</body>
</html>
