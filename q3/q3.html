<body>

    <h1>Questão 03 - JS</h1>
    <h2>Escreva um programa que converta valores de polegadas em centímetros.</h2>
    
    <form id="convertPolToCm">
        <label for="pol">Valor em polegadas:</label>
        <input 
            id="pol"
            type="number"
            step="0.01"
            required
        >

        <button type="submit">Converter</button>
    </form>

    <p id="resultado"></p>
</body>
